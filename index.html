<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRWK—VIZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/15.0.4/Tone.js"></script>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body data-mode="compose">
  <div class="app">

    <div class="status-strip">
      <span class="brand">KRWK—VIZ</span>
      <span class="center">BONES <span class="sep">·</span> HUMAN <span class="sep">·</span> COLOR</span>
      <div class="right">
        <span><span class="live-dot" id="live-dot"></span>LIVE</span>
        <span>BPM <span class="v" id="s-bpm">128</span></span>
        <span>BAR <span class="v" id="s-bar">1.1</span></span>
        <span>LOOP <span class="v" id="s-loop">0</span></span>
        <span>SEED <span class="v" id="s-seed">4011</span></span>
        <span class="mode-pill" id="mode-pill">COMPOSE</span>
      </div>
    </div>

    <div class="view-stack">
      <div class="view view-compose" id="view-compose"></div>
      <div class="view view-vizu" id="view-vizu"></div>
    </div>

    <div class="signature">
      <span>SIGNAL <span class="v" id="sig-db">−∞ dB</span> · SR <span class="v">48000</span> · BUF <span class="v">256</span> · LAT <span class="v">5.3 ms</span></span>
      <span class="c"><span class="rec">● RECORDING SESSION 001</span></span>
      <span class="r"><span class="kbd-hint">TAB</span> SWAP <span class="kbd-hint">SPACE</span> PLAY</span>
    </div>

  </div>
  <script type="module" src="js/main.js?v=7"></script>
</body>
</html>
